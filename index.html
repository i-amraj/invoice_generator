<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      /* पीछे का सब धुंधला कर देगा */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      border: 2px solid #eee;
      border-radius: 8px;
      text-align: center;
      font-size: 1.1rem;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    /* Spinner Animation */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="custom-alert-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h3 id="modal-title">Action Required</h3>
      <p id="modal-message">Please enter your code</p>
      <div id="modal-input-area">
        <input type="password" id="modal-password-input" placeholder="••••••••" />
        <div class="modal-buttons">
          <button type="button" id="modal-cancel-btn" class="btn-secondary">Cencel</button>
          <button type="button" id="modal-submit-btn" class="btn-primary">Verify</button>
        </div>
      </div>
      <div id="modal-loading-area" style="display:none;">
        <div class="spinner"></div>
        <p>verifying.... please wait</p>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>Professional Invoice Generator</h1>
    <form id="invoice-form">
      <!-- Editable Company Settings -->
      <div class="section settings-section">
        <h2>Company Settings</h2>
        <div class="grid-2">
          <label>Company Name: <input type="text" name="compName" value="FIREFLIES INFOTECH PRIVATE LIMITED" /></label>
          <label>GSTIN: <input type="text" name="compGST" value="09AACCF9544M2Z0" /></label>
        </div>
        <div class="grid-2">
          <label>CIN No.: <input type="text" name="compCIN" value="U72900DL2019PTC307683" /></label>
          <label>Mobile: <input type="text" name="compMobile" value="8896961906, 9415052356" /></label>
        </div>
        <div class="grid-2">
          <label>Website URL: <input type="url" name="compWebsite" value="https://ffit.io" /></label>
          <div id="qrcode-container" style="display:none;"></div>
        </div>
        <label>Address: <textarea name="compAddress"
            rows="2">Head Office: 7/17-A Parwati Bangla Road, Kanpur (U.P.) - 208002</textarea></label>
      </div>

      <!-- Bank Details Settings -->
      <div class="section settings-section">
        <h2>Bank Details Settings</h2>
        <div class="grid-2">
          <div class="bank-box">
            <h3>Bank 1</h3>
            <label>Name: <input type="text" name="bank1Name" value="INDIAN BANK" /></label>
            <label>A/c No.: <input type="text" name="bank1Acc" value="7108770637" /></label>
            <label>IFSC: <input type="text" name="bank1IFSC" value="IDIB000S810" /></label>
            <label>Branch: <input type="text" name="bank1Branch" value="SWAROOP NAGAR KANPUR-208002" /></label>
          </div>
          <div class="bank-box">
            <h3>Bank 2</h3>
            <label>Name: <input type="text" name="bank2Name" value="STATE BANK OF INDIA" /></label>
            <label>A/c No.: <input type="text" name="bank2Acc" value="39783639650" /></label>
            <label>IFSC: <input type="text" name="bank2IFSC" value="SBIN0030246" /></label>
            <label>Branch: <input type="text" name="bank2Branch" value="BIRHANA ROAD KANPUR-208001" /></label>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Bill To</h2>
        <textarea name="billTo" id="billTo" rows="3">IGNITED GYM FITNESS
B-1/18, Sector H, Sector-A, Aliganj, Lucknow, Uttar Pradesh 226024
Mobile: 9571022687</textarea>
      </div>
      <div class="section">
        <h2>Invoice Details</h2>
        <label>Invoice Type:
          <select name="invoiceType" id="invoiceType">
            <option value="PERFORMA INVOICE" selected>Performa Invoice</option>
            <option value="TAX INVOICE">Tax Invoice</option>
          </select>
        </label>
        <label>Invoice No.: <input type="text" name="invoiceNo" value="PF/2026/001" /></label>
        <label>Date: <input type="date" name="date" id="invoice-date" /></label>
      </div>
      <div class="section">
        <h2>Items</h2>
        <table id="items-table">
          <thead>
            <tr>
              <th>Description</th>
              <th>HSN/SAC</th>
              <th>Qty</th>
              <th>Rate</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="items-body">
            <tr>
              <td><input type="text" name="desc[]" value="BODYBANNAO GYM SOFTWARE" /></td>
              <td><input type="text" name="hsn[]" value="9983" /></td>
              <td><input type="number" name="qty[]" value="1" min="1" /></td>
              <td><input type="number" name="rate[]" value="5085" min="0" /></td>
              <td><input type="number" name="amount[]" value="5085" readonly /></td>
              <td><button type="button" class="remove-row">Remove</button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" id="add-row">Add Row</button>
      </div>
      <div class="section">
        <h2>GST</h2>
        <label>GST Rate:
          <select name="gstRate" id="gstRate">
            <option value="0">0%</option>
            <option value="9" selected>9% (CGST + 9% SGST)</option>
            <option value="18">18%</option>
            <option value="28">28%</option>
          </select>
        </label>
      </div>
      <div class="section">
        <h2>Totals</h2>
        <label>Subtotal: <input type="number" id="subtotal" name="subtotal" value="5085" readonly /></label>
        <label>CGST: <input type="number" id="cgst" name="cgst" value="457.65" readonly /></label>
        <label>SGST: <input type="number" id="sgst" name="sgst" value="457.65" readonly /></label>
        <label>Total: <input type="number" id="total" name="total" value="6000.3" readonly /></label>
      </div>
      <div class="section">
        <h2>Declaration</h2>
        <textarea name="declaration" id="declaration" rows="4">E. & O.E.
1. Declaration-We declare that this Invoice Shows the actual price of the goods described & that all particulars are true & correct.
2. Goods once sold will not be taken back.
3. All Disputes Subject to Kanpur Jurisdiction.</textarea>
      </div>
      <div class="section">
        <h2>Signature</h2>
        <div class="signature-container">
          <canvas id="signature-pad" width="400" height="200"></canvas>
        </div>
        <button type="button" id="clear-signature">Clear Signature</button>
      </div>
      <button type="submit">Generate PDF</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>

</html>
